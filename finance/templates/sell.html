{% extends "layout.html" %}
{% block title %}Sell{% endblock %}
{% block main %}
<div class="form-card">
<h1 class="h3 mb-4">Sell shares</h1>
{% if holdings %}
<form action="/sell" method="post">
    <div class="mb-3"><select class="form-select" name="symbol" required>
        <option value="" disabled selected>Select a stock</option>
        {% for holding in holdings %}<option value="{{ holding.symbol }}">{{ holding.symbol }} — {{ holding.shares }} share(s)</option>{% endfor %}
    </select></div>
    <div class="mb-3"><input class="form-control" min="1" name="shares" placeholder="Number of shares" required type="number" step="1"></div>
    <button class="btn btn-primary w-100" type="submit">Sell</button>
</form>
{% else %}
<p class="text-secondary">You don't own any shares to sell yet.</p>
{% endif %}
</div>
{% endblock %}
