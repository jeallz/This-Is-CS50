{% extends "layout.html" %}
{% block title %}Quote{% endblock %}
{% block main %}
<div class="form-card">
<h1 class="h3 mb-4">Get a stock quote</h1>
<form action="/quote" method="post">
    <div class="mb-3"><input autofocus class="form-control text-uppercase" name="symbol" placeholder="Stock symbol (e.g. AAPL)" required type="text"></div>
    <button class="btn btn-primary w-100" type="submit">Get quote</button>
</form>
</div>
{% endblock %}
