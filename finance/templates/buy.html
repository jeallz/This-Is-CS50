{% extends "layout.html" %}
{% block title %}Buy{% endblock %}
{% block main %}
<div class="form-card">
<h1 class="h3 mb-4">Buy shares</h1>
<form action="/buy" method="post">
    <div class="mb-3"><input autofocus class="form-control text-uppercase" name="symbol" placeholder="Stock symbol" required type="text"></div>
    <div class="mb-3"><input class="form-control" min="1" name="shares" placeholder="Number of shares" required type="number" step="1"></div>
    <button class="btn btn-primary w-100" type="submit">Buy</button>
</form>
</div>
{% endblock %}
