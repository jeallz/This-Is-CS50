{% extends "layout.html" %}
{% block title %}Register{% endblock %}
{% block main %}
<div class="form-card">
<h1 class="h3 mb-4">Create account</h1>
<form action="/register" method="post">
    <div class="mb-3"><input autocomplete="username" autofocus class="form-control" name="username" placeholder="Username" required type="text"></div>
    <div class="mb-3"><input autocomplete="new-password" class="form-control" name="password" placeholder="Password" required type="password"></div>
    <div class="mb-3"><input autocomplete="new-password" class="form-control" name="confirmation" placeholder="Confirm password" required type="password"></div>
    <button class="btn btn-primary w-100" type="submit">Register</button>
</form>
</div>
{% endblock %}
